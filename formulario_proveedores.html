<style>
* { box-sizing:border-box; margin:0; padding:0; }
:root { --verde:#316046; --naranja:#DD704A; --bg:#f5f0eb; --card:#fff; --text:#233a30; --muted:#8a9690; --border:#e0d6cc; --rojo:#c0392b; }
body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; background:var(--bg); color:var(--text); padding-bottom:90px; }
header { background:var(--card); border-bottom:3px solid var(--verde); padding:10px 20px; display:flex; align-items:center; gap:12px; position:sticky; top:0; z-index:20; }
header img { height:32px; width:32px; border-radius:50%; }
header .t { font-size:1rem; font-weight:800; letter-spacing:.5px; }
header .s { font-size:.66rem; color:var(--muted); }
.bar { background:var(--card); border-bottom:1px solid var(--border); padding:10px 16px; display:flex; gap:8px; align-items:center; flex-wrap:wrap; position:sticky; top:54px; z-index:19; }
.lbl { font-size:.62rem; font-weight:700; text-transform:uppercase; color:var(--muted); }
.btn-group { display:flex; gap:4px; flex-wrap:wrap; }
.pbtn { padding:6px 14px; border:1.5px solid var(--border); border-radius:20px; background:var(--bg); font-size:.8rem; font-weight:700; cursor:pointer; color:var(--muted); }
.pbtn.active { background:var(--verde); border-color:var(--verde); color:#fff; }
input[type=date] { padding:5px 10px; border:1.5px solid var(--border); border-radius:20px; background:var(--bg); font-size:.78rem; color:var(--text); }
.wrap { max-width:760px; margin:0 auto; padding:8px 0 0; }
.card { background:var(--card); margin:10px 14px; border-radius:14px; box-shadow:0 1px 4px rgba(0,0,0,.06); overflow:hidden; }
.row { display:grid; align-items:center; gap:8px; padding:10px 14px; border-bottom:1px solid #f0ebe5; }
.row:last-child { border-bottom:none; }
.row.unidad { grid-template-columns: 1fr 78px 64px 90px; }
.row.docena { grid-template-columns: 1fr 60px 54px 64px 84px; }
.rhead { font-size:.6rem; font-weight:700; text-transform:uppercase; color:var(--muted); background:#faf7f3; }
.nombre { font-weight:600; font-size:.9rem; }
.qty, .precio-inp { width:100%; padding:7px 6px; border:1.5px solid var(--border); border-radius:9px; font-size:.9rem; text-align:right; background:#fafafa; }
.qty:focus, .precio-inp:focus { outline:none; border-color:var(--verde); background:#fff; }
.calc { font-size:.78rem; color:var(--muted); text-align:right; }
.total-line { font-weight:800; text-align:right; color:var(--verde); font-size:.92rem; }
.foot { position:fixed; bottom:0; left:0; right:0; background:var(--card); border-top:1px solid var(--border); padding:12px 16px; display:flex; align-items:center; justify-content:space-between; gap:12px; }
.foot .tot { font-size:.7rem; color:var(--muted); }
.foot .tot b { display:block; font-size:1.5rem; color:var(--verde); }
.save { background:var(--verde); color:#fff; border:none; border-radius:12px; padding:13px 22px; font-size:.95rem; font-weight:700; cursor:pointer; }
.save:disabled { opacity:.5; }
.sec-title { padding:14px 16px 4px; font-size:.7rem; font-weight:700; text-transform:uppercase; color:var(--muted); }
.ped { display:flex; justify-content:space-between; padding:9px 14px; border-bottom:1px solid #f0ebe5; font-size:.82rem; }
.ped:last-child { border-bottom:none; }
.ped .pv { color:var(--muted); font-size:.72rem; }
#loading { text-align:center; padding:50px; color:var(--muted); }
.spin { width:30px; height:30px; border:3px solid var(--border); border-top-color:var(--verde); border-radius:50%; animation:r 1s linear infinite; margin:0 auto 12px; }
@keyframes r { to { transform:rotate(360deg); } }
.toast { position:fixed; bottom:90px; left:50%; transform:translateX(-50%); background:var(--verde); color:#fff; padding:11px 20px; border-radius:24px; font-size:.85rem; font-weight:600; opacity:0; transition:opacity .25s; pointer-events:none; z-index:50; }
.toast.show { opacity:1; } .toast.error { background:var(--rojo); }
/* Comprobante / captura */
.ov { position:fixed; inset:0; background:rgba(0,0,0,.55); display:none; align-items:flex-start; justify-content:center; padding:24px 14px; overflow-y:auto; z-index:60; }
.ov.show { display:flex; }
.comp { background:#fff; width:100%; max-width:420px; border-radius:16px; overflow:hidden; box-shadow:0 8px 30px rgba(0,0,0,.25); }
.comp-head { background:var(--verde); color:#fff; padding:16px 18px; display:flex; align-items:center; gap:12px; }
.comp-head img { height:38px; width:38px; border-radius:50%; }
.comp-head .ch-t { font-weight:800; font-size:1.05rem; letter-spacing:.5px; }
.comp-head .ch-s { font-size:.72rem; opacity:.9; }
.comp-meta { display:flex; justify-content:space-between; padding:10px 18px; font-size:.8rem; color:var(--muted); border-bottom:1px solid var(--border); }
.comp-meta b { color:var(--text); }
.comp-tabla { width:100%; border-collapse:collapse; }
.comp-tabla th, .comp-tabla td { padding:8px 18px; font-size:.82rem; text-align:right; }
.comp-tabla th { font-size:.62rem; text-transform:uppercase; color:var(--muted); font-weight:700; border-bottom:1px solid var(--border); }
.comp-tabla td.cn { text-align:left; font-weight:600; color:var(--text); }
.comp-tabla tr:nth-child(even) td { background:#faf7f3; }
.comp-total { display:flex; justify-content:space-between; align-items:center; padding:14px 18px; background:#eef4f0; }
.comp-total span { font-size:.72rem; font-weight:700; text-transform:uppercase; color:var(--muted); }
.comp-total b { font-size:1.4rem; color:var(--verde); }
.comp-actions { display:flex; gap:10px; max-width:420px; width:100%; margin-top:12px; }
.comp-actions button { flex:1; padding:13px; border-radius:12px; border:none; font-size:.9rem; font-weight:700; cursor:pointer; }
.btn-cerrar { background:#e8e2da; color:#555; }
.btn-captura { background:var(--naranja); color:#fff; }
</style>
</head>

  <div><div class="t">ARONDA — Proveedores</div><div class="s">Registro de pedidos</div></div>
</header>

<div class="bar">
  <span class="lbl">Proveedor</span>
  <div class="btn-group" id="prov-btns"></div>
  <span class="lbl" style="margin-left:auto">Fecha</span>
  <input type="date" id="fecha">
</div>

<div class="wrap">
  <div id="loading"><div class="spin"></div>Cargando…</div>
  <div id="content" style="display:none">
    <div class="card" id="lista"></div>

    <div class="sec-title">Pedidos recientes</div>
    <div class="card" id="recientes"></div>
  </div>
</div>

<div class="foot" id="foot" style="display:none">
  <div class="tot">Total del pedido<b id="gran-total">$0</b></div>
  <button class="save" id="btn-save" onclick="guardar()">Guardar pedido</button>
</div>

<div class="ov" id="comp-ov">
  <div>
    <div class="comp" id="comprobante">
      <div class="comp-head">
        <img id="comp-logo" alt="Aronda">
        <div><div class="ch-t">ARONDA</div><div class="ch-s">Pedido a proveedor</div></div>
      </div>
      <div class="comp-meta"><span>Proveedor: <b id="comp-prov"></b></span><span>Fecha: <b id="comp-fecha"></b></span></div>
      <table class="comp-tabla">
        <thead><tr><th class="cn" style="text-align:left">Concepto</th><th>Cant.</th><th>Precio</th><th>Total</th></tr></thead>
        <tbody id="comp-items"></tbody>
      </table>
      <div class="comp-total"><span>Total del pedido</span><b id="comp-total">$0</b></div>
    </div>
    <div class="comp-actions">
      <button class="btn-cerrar" onclick="cerrarComp()">Cerrar</button>
      <button class="btn-captura" id="btn-captura" onclick="compartir()">📷 Compartir / Descargar</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ── CONFIG: pegá acá la URL /exec del Apps Script de proveedores ──────────────
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxKKEjud38J_ri5kBVmWBl30lT-KkiClR4a_Dc-6ViYb3vWGd9O_AXFlYmR8mM_FG3ekQ/exec";

let catalogo = [], pedidos = [], proveedor = null;
const fmt = n => "$" + Math.round(n).toLocaleString("es-AR");

document.getElementById("fecha").value = (() => { const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; })();

async function cargar() {
  try {
    const data = await fetch(APPS_SCRIPT_URL + "?t=" + Date.now()).then(r => r.json());
    catalogo = data.catalogo || [];
    pedidos  = data.pedidos || [];
    const provs = [...new Set(catalogo.map(c => c.proveedor))];
    proveedor = provs[0] || null;
    document.getElementById("prov-btns").innerHTML = provs.map(p =>
      `<button class="pbtn${p===proveedor?" active":""}" data-p="${p}" onclick="setProv('${p}')">${p}</button>`).join("");
    document.getElementById("loading").style.display = "none";
    document.getElementById("content").style.display = "block";
    document.getElementById("foot").style.display = "flex";
    render(); renderRecientes();
  } catch(e) {
    document.getElementById("loading").innerHTML = "❌ Error al cargar. ¿Pegaste la URL del script?";
  }
}

function setProv(p) {
  proveedor = p;
  document.querySelectorAll(".pbtn").forEach(b => b.classList.toggle("active", b.dataset.p === p));
  render();
}

function render() {
  const items = catalogo.filter(c => c.proveedor === proveedor);
  const esDocena = items.some(i => (i.unidad||"") === "docena");
  let html = esDocena
    ? `<div class="row docena rhead"><div>Concepto</div><div>Docenas</div><div>Cant.</div><div>Precio u.</div><div>Total</div></div>`
    : `<div class="row unidad rhead"><div>Concepto</div><div>Precio u.</div><div>Cant.</div><div>Total</div></div>`;

  items.forEach((it, i) => {
    const u = (it.unidad||"") === "docena" ? "docena" : "unidad";
    if (u === "docena") {
      html += `<div class="row docena" data-i="${i}">
        <div class="nombre">${it.concepto}</div>
        <input class="qty" type="number" min="0" step="1" inputmode="numeric" data-i="${i}" data-k="doc" value="" placeholder="0" oninput="recalc()">
        <div class="calc" id="cant-${i}">0</div>
        <input class="precio-inp" type="number" min="0" step="1" inputmode="numeric" data-i="${i}" data-k="precio" value="${it.precio}" onchange="cambiarPrecio(${i})">
        <div class="total-line" id="tot-${i}">$0</div>
      </div>`;
    } else {
      html += `<div class="row unidad" data-i="${i}">
        <div class="nombre">${it.concepto}</div>
        <input class="precio-inp" type="number" min="0" step="1" inputmode="numeric" data-i="${i}" data-k="precio" value="${it.precio}" onchange="cambiarPrecio(${i})">
        <input class="qty" type="number" min="0" step="1" inputmode="numeric" data-i="${i}" data-k="cant" value="" placeholder="0" oninput="recalc()">
        <div class="total-line" id="tot-${i}">$0</div>
      </div>`;
    }
  });
  document.getElementById("lista").innerHTML = html;
  recalc();
}

function lineas() {
  const items = catalogo.filter(c => c.proveedor === proveedor);
  return items.map((it, i) => {
    const u = (it.unidad||"") === "docena" ? "docena" : "unidad";
    const precio = num(`input[data-i="${i}"][data-k="precio"]`, it.precio);
    let docenas = 0, cantidad = 0;
    if (u === "docena") { docenas = num(`input[data-i="${i}"][data-k="doc"]`, 0); cantidad = docenas * 12; }
    else { cantidad = num(`input[data-i="${i}"][data-k="cant"]`, 0); }
    return { concepto: it.concepto, unidad: u, docenas, cantidad, precio, total: cantidad * precio, i };
  });
}
function num(sel, def) { const el = document.querySelector(sel); const v = el ? parseFloat(el.value) : NaN; return isNaN(v) ? (def||0) : v; }

function recalc() {
  let gran = 0;
  lineas().forEach(l => {
    const c = document.getElementById("cant-"+l.i); if (c) c.textContent = l.cantidad.toLocaleString("es-AR");
    document.getElementById("tot-"+l.i).textContent = fmt(l.total);
    gran += l.total;
  });
  document.getElementById("gran-total").textContent = fmt(gran);
}

async function cambiarPrecio(i) {
  const it = catalogo.filter(c => c.proveedor === proveedor)[i];
  const nuevo = num(`input[data-i="${i}"][data-k="precio"]`, it.precio);
  it.precio = nuevo;
  recalc();
  fetch(APPS_SCRIPT_URL, { method:"POST", mode:"no-cors", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({ action:"update_precio", proveedor, concepto: it.concepto, precio: nuevo }) });
}

async function guardar() {
  const items = lineas().filter(l => l.total > 0);
  if (!items.length) { toast("Cargá al menos una cantidad", true); return; }
  const fecha = document.getElementById("fecha").value;
  const total = items.reduce((s,l)=>s+l.total, 0);
  const btn = document.getElementById("btn-save"); btn.disabled = true; btn.textContent = "Guardando…";
  try {
    await fetch(APPS_SCRIPT_URL, { method:"POST", mode:"no-cors", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ action:"save_pedido", fecha, proveedor, items, total }) });
    // optimista: agregar a recientes
    items.forEach(l => pedidos.push({ pedido_id: fecha+"_"+proveedor, fecha, proveedor, concepto:l.concepto, cantidad:l.cantidad, precio:l.precio, total:l.total }));
    mostrarComprobante(fecha, proveedor, items, total); // detalle + opción de captura
    document.querySelectorAll(".qty").forEach(q => q.value = "");
    recalc(); renderRecientes();
  } catch(e) { toast("❌ Error de conexión", true); }
  finally { btn.disabled = false; btn.textContent = "Guardar pedido"; }
}

// ── Comprobante con detalle + captura ────────────────────────────────────────
function mostrarComprobante(fecha, prov, items, total) {
  const logo = document.querySelector("header img");
  if (logo) document.getElementById("comp-logo").src = logo.src;
  document.getElementById("comp-prov").textContent  = prov;
  document.getElementById("comp-fecha").textContent = fecha;
  document.getElementById("comp-items").innerHTML = items.map(l =>
    `<tr><td class="cn">${l.concepto}</td><td>${l.cantidad}${l.unidad==="docena"?` <span style="color:#8a9690">(${l.docenas}doc)</span>`:""}</td><td>${fmt(l.precio)}</td><td>${fmt(l.total)}</td></tr>`
  ).join("");
  document.getElementById("comp-total").textContent = fmt(total);
  document.getElementById("comp-ov").classList.add("show");
}
function cerrarComp() { document.getElementById("comp-ov").classList.remove("show"); }

async function compartir() {
  const target = document.getElementById("comprobante");
  const prov = document.getElementById("comp-prov").textContent;
  const fecha = document.getElementById("comp-fecha").textContent;
  const nombre = `pedido-${prov}-${fecha}.png`;
  const btn = document.getElementById("btn-captura"); btn.disabled = true;
  try {
    const canvas = await html2canvas(target, { backgroundColor:"#ffffff", scale:2, useCORS:true });
    const dataUrl = canvas.toDataURL("image/png");
    if (navigator.share && navigator.canShare) {
      canvas.toBlob(async blob => {
        const file = new File([blob], nombre, { type:"image/png" });
        try { await navigator.share({ files:[file], title:`Pedido ${prov}` }); }
        catch(e) { descargar(dataUrl, nombre); }
      });
    } else { descargar(dataUrl, nombre); }
  } catch(e) { toast("❌ No se pudo generar la imagen", true); }
  finally { btn.disabled = false; }
}
function descargar(dataUrl, nombre) {
  const a = document.createElement("a"); a.href = dataUrl; a.download = nombre; a.click();
  toast("✅ Imagen lista");
}

function renderRecientes() {
  // Agrupar por pedido_id → total
  const g = {};
  pedidos.forEach(p => {
    const k = p.pedido_id || (p.fecha+"_"+p.proveedor);
    if (!g[k]) g[k] = { fecha: String(p.fecha).slice(0,10), proveedor: p.proveedor, total: 0 };
    g[k].total += Number(p.total) || 0;
  });
  const arr = Object.values(g).sort((a,b) => a.fecha < b.fecha ? 1 : -1).slice(0, 12);
  document.getElementById("recientes").innerHTML = arr.length
    ? arr.map(p => `<div class="ped"><div><b>${p.proveedor}</b><div class="pv">${p.fecha}</div></div><div class="total-line">${fmt(p.total)}</div></div>`).join("")
    : `<div class="ped"><span class="pv">Todavía no hay pedidos</span></div>`;
}

function toast(msg, err=false) {
  const t = document.getElementById("toast"); t.textContent = msg;
  t.className = "toast show" + (err?" error":"");
  setTimeout(() => t.className = "toast" + (err?" error":""), 2800);
}

cargar();
</script>
</body>
</html>
