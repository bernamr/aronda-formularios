<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #f5f0eb;
    min-height: 100vh;
    padding-bottom: 40px;
  }

  header {
    background: #316046;
    color: #f5e6d3;
    padding: 16px 20px;
    display: flex;
    align-items: center;
    gap: 12px;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  header h1 { font-size: 1.2rem; font-weight: 700; letter-spacing: 1px; }
  header p  { font-size: 0.75rem; opacity: 0.7; }

  .top-fields {
    background: #fff;
    padding: 16px 20px;
    display: flex;
    gap: 12px;
    border-bottom: 1px solid #e0d6cc;
  }
  .top-fields label { font-size: 0.7rem; color: #888; font-weight: 600; text-transform: uppercase; }
  .top-fields select,
  .top-fields input[type=date] {
    display: block;
    margin-top: 4px;
    border: 1.5px solid #ddd;
    border-radius: 8px;
    padding: 8px 10px;
    font-size: 0.95rem;
    color: #333;
    background: #fafafa;
    width: 100%;
  }
  .turno-wrap { flex: 1; }
  .fecha-wrap { flex: 1.4; }

  .empleada-selector {
    background: #fff;
    padding: 12px 20px;
    display: flex;
    gap: 10px;
    border-bottom: 1px solid #e0d6cc;
  }
  .empleada-selector label {
    font-size: 0.7rem;
    color: #888;
    font-weight: 600;
    text-transform: uppercase;
    display: block;
    margin-bottom: 4px;
  }
  .empleada-btn {
    flex: 1;
    padding: 10px 0;
    border: 2px solid #ddd;
    border-radius: 8px;
    background: #fafafa;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    color: #666;
    transition: all .15s;
  }
  .empleada-btn.active { background: #f0ebe5; border-color: #316046; color: #316046; }

  .turno-btn-group {
    display: flex;
    gap: 8px;
    margin-top: 4px;
  }
  .turno-btn {
    flex: 1;
    padding: 10px 0;
    border: 2px solid #ddd;
    border-radius: 8px;
    background: #fafafa;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    color: #666;
    transition: all .15s;
  }
  .turno-btn.active-m { background: #fff3e0; border-color: #f4a03a; color: #c47a00; }
  .turno-btn.active-t { background: #e8f4fd; border-color: #3a9af4; color: #1565c0; }

  .group-title {
    font-size: 0.65rem;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: #999;
    padding: 14px 20px 4px;
  }

  .product-list {
    background: #fff;
    border-top: 1px solid #eee;
    border-bottom: 1px solid #eee;
  }

  .product-row {
    display: flex;
    align-items: center;
    padding: 12px 20px;
    border-bottom: 1px solid #f0ebe5;
    gap: 12px;
  }
  .product-row:last-child { border-bottom: none; }

  .product-name {
    flex: 1;
    font-size: 0.95rem;
    color: #333;
  }

  .qty-control {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .qty-btn {
    width: 32px; height: 32px;
    border-radius: 50%;
    border: none;
    font-size: 1.2rem;
    font-weight: 700;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: transform .1s;
  }
  .qty-btn:active { transform: scale(0.9); }
  .qty-btn.minus { background: #f0ebe5; color: #888; }
  .qty-btn.plus  { background: #316046; color: #fff; }
  .qty-display {
    width: 36px;
    text-align: center;
    font-size: 1.1rem;
    font-weight: 700;
    color: #333;
  }
  .qty-display.nonzero { color: #316046; }

  .submit-area {
    padding: 24px 20px 8px;
  }
  .submit-btn {
    width: 100%;
    padding: 16px;
    background: #316046;
    color: #fff;
    border: none;
    border-radius: 14px;
    font-size: 1.05rem;
    font-weight: 700;
    letter-spacing: 0.5px;
    cursor: pointer;
    transition: opacity .2s;
  }
  .submit-btn:active { opacity: 0.8; }
  .submit-btn:disabled { opacity: 0.4; }

  .toast {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: #316046;
    color: #fff;
    padding: 14px 28px;
    border-radius: 30px;
    font-size: 0.95rem;
    font-weight: 600;
    transition: transform .3s ease;
    z-index: 100;
    white-space: nowrap;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }
  .toast.error { background: #c0392b; }

  .overlay-estado {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 200;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    text-align: center;
    padding: 40px;
  }
  .overlay-estado.show { display: flex; }
  .overlay-estado.procesando { background: rgba(44,26,14,0.93); }
  .overlay-estado.ok         { background: #316046; }
  .overlay-estado .estado-icon { font-size: 4rem; }
  .overlay-estado .estado-texto {
    color: #fff;
    font-size: 2rem;
    font-weight: 800;
    letter-spacing: 1px;
    line-height: 1.2;
  }
  .overlay-estado .estado-sub {
    color: rgba(255,255,255,0.65);
    font-size: 1rem;
    font-weight: 500;
  }
</style>
</head>

</header>

<div class="top-fields">
  <div class="fecha-wrap">
    <label>Fecha</label>
    <input type="date" id="fecha">
  </div>
  <div class="turno-wrap">
    <label>Turno</label>
    <div class="turno-btn-group">
      <button class="turno-btn" id="btn-m" onclick="setTurno('manana')">☀️ Mañana</button>
      <button class="turno-btn" id="btn-t" onclick="setTurno('tarde')">🌙 Tarde</button>
    </div>
  </div>
</div>

<div class="empleada-selector">
  <div style="width:100%">
    <label>¿Quién registra?</label>
    <div style="display:flex;gap:10px">
      <button class="empleada-btn" id="btn-nadia" onclick="setEmpleada('Nadia')">👩 Nadia</button>
      <button class="empleada-btn" id="btn-lara"  onclick="setEmpleada('Lara')">👩 Lara</button>
    </div>
  </div>
</div>

<div id="form-body"></div>

<div class="submit-area">
  <button class="submit-btn" id="submitBtn" onclick="enviar()">Enviar ventas</button>
</div>

<div class="toast" id="toast"></div>

<div class="overlay-estado" id="overlay-procesando">
  <div class="estado-icon">⏳</div>
  <div class="estado-texto">Procesando...</div>
  <div class="estado-sub">Registrando las ventas del turno</div>
</div>

<div class="overlay-estado" id="overlay-ok">
  <div class="estado-icon">✅</div>
  <div class="estado-texto">¡Ventas registradas!</div>
  <div class="estado-sub" id="overlay-ok-sub"></div>
</div>

<script>
// ── Configuración ──────────────────────────────────────────────────────────────
const APPS_SCRIPT_URL    = "https://script.google.com/macros/s/AKfycbxjZXiBukijNCWCnM9s-QqtTnz8q1_gRm9pxGOsUFj6U-nDAlNEfVdEd27hoTVCPo2HOA/exec";
const PRODUCTOS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycby9AOVwJa2YdcbxAzpuH3bsbnXqGo-d-K2_9CjK5MsrrLZwQfyfZNK3hOd5UQeMVT04nw/exec";

// ── Estado ─────────────────────────────────────────────────────────────────────
let turno = null;
let empleada = null;
const qty = {};
let PRODUCTOS = [];

// ── Inicialización ─────────────────────────────────────────────────────────────
const _hoy = new Date(); document.getElementById("fecha").value = `${_hoy.getFullYear()}-${String(_hoy.getMonth()+1).padStart(2,"0")}-${String(_hoy.getDate()).padStart(2,"0")}`;
document.getElementById("form-body").innerHTML = '<div style="text-align:center;padding:40px;color:#aaa">Cargando productos...</div>';

// Cargar productos dinámicamente desde Aronda_Productos
fetch(PRODUCTOS_SCRIPT_URL)
  .then(r => r.json())
  .then(data => {
    const activos = (data.productos || []).filter(p => String(p.activo) === "1");
    // Agrupar por grupo
    const grupos = {};
    activos.forEach(p => {
      const g = p.grupo || "Otros";
      if (!grupos[g]) grupos[g] = [];
      grupos[g].push({ id: p.producto_id, nombre: p.nombre });
    });
    PRODUCTOS = Object.entries(grupos).map(([group, items]) => ({ group, items }));
    activos.forEach(p => qty[p.producto_id] = 0);
    renderForm();
  })
  .catch(() => {
    document.getElementById("form-body").innerHTML =
      '<div style="text-align:center;padding:40px;color:#c0392b">❌ Error al cargar productos</div>';
  });

function renderForm() {
  const body = document.getElementById("form-body");
  body.innerHTML = "";

  PRODUCTOS.forEach(group => {
    const title = document.createElement("div");
    title.className = "group-title";
    title.textContent = group.group;
    body.appendChild(title);

    const list = document.createElement("div");
    list.className = "product-list";

    group.items.forEach(p => {
      const row = document.createElement("div");
      row.className = "product-row";
      row.innerHTML = `
        <span class="product-name">${p.nombre}</span>
        <div class="qty-control">
          <button class="qty-btn minus" onclick="change('${p.id}', -1)">−</button>
          <span class="qty-display" id="qty-${p.id}">0</span>
          <button class="qty-btn plus"  onclick="change('${p.id}', +1)">+</button>
        </div>`;
      list.appendChild(row);
    });

    body.appendChild(list);
  });
}

function change(id, delta) {
  qty[id] = Math.max(0, qty[id] + delta);
  const el = document.getElementById("qty-" + id);
  el.textContent = qty[id];
  el.className = "qty-display" + (qty[id] > 0 ? " nonzero" : "");
}

function setEmpleada(nombre) {
  empleada = nombre;
  document.getElementById("btn-nadia").className = "empleada-btn" + (nombre === "Nadia" ? " active" : "");
  document.getElementById("btn-lara").className  = "empleada-btn" + (nombre === "Lara"  ? " active" : "");
}

function setTurno(t) {
  turno = t;
  document.getElementById("btn-m").className = "turno-btn" + (t === "manana" ? " active-m" : "");
  document.getElementById("btn-t").className = "turno-btn" + (t === "tarde"  ? " active-t" : "");
}

function showToast(msg, isError = false) {
  const toast = document.getElementById("toast");
  toast.textContent = msg;
  toast.className = "toast" + (isError ? " error" : "") + " show";
  setTimeout(() => toast.className = "toast" + (isError ? " error" : ""), 3000);
}

async function enviar() {
  const fecha = document.getElementById("fecha").value;
  if (!empleada){ showToast("⚠️ Seleccioná quién registra", true); return; }
  if (!fecha)  { showToast("⚠️ Seleccioná una fecha", true); return; }
  if (!turno)  { showToast("⚠️ Seleccioná el turno", true);  return; }

  const entradas = Object.entries(qty)
    .filter(([, v]) => v > 0)
    .map(([id, v]) => ({ producto_id: id, cantidad: v }));

  if (!entradas.length) { showToast("⚠️ No hay ventas para registrar", true); return; }

  const btn = document.getElementById("submitBtn");
  btn.disabled = true;

  // Mostrar pantalla "Procesando"
  document.getElementById("overlay-procesando").className = "overlay-estado procesando show";

  const payload = { fecha, turno, empleada, entradas };

  try {
    await fetch(APPS_SCRIPT_URL, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload),
    });

    // Ocultar procesando, mostrar éxito
    document.getElementById("overlay-procesando").className = "overlay-estado procesando";
    const totalUnidades = entradas.reduce((s,e) => s + e.cantidad, 0);
    document.getElementById("overlay-ok-sub").textContent =
      `${totalUnidades} unidades · ${turno === "manana" ? "☀️ Mañana" : "🌙 Tarde"} · ${empleada}`;
    document.getElementById("overlay-ok").className = "overlay-estado ok show";

    // Resetear cantidades
    PRODUCTOS.forEach(g => g.items.forEach(p => { qty[p.id] = 0; }));
    renderForm();

    // Ocultar éxito después de 2.5s
    setTimeout(() => {
      document.getElementById("overlay-ok").className = "overlay-estado ok";
    }, 2500);

  } catch (e) {
    document.getElementById("overlay-procesando").className = "overlay-estado procesando";
    showToast("❌ Error al enviar. Revisá el WiFi.", true);
  } finally {
    btn.disabled = false;
  }
}
</script>
</body>
</html>
